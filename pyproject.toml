[project]
name = "reviewflow"
version = "0.1.0"
description = "Code-review flow insights for GitHub repositories, with an LLM narrative grounded in verified facts."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in tests and for type narrowing

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake tokens in tests
"evals/**" = ["S311", "S106"]  # seeded simulation RNG; placeholder token

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "evals/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
